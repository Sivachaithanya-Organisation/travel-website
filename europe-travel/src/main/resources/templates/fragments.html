<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- fragment holder, not rendered directly -->
</head>
<body>

  <th:block th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' · Wayfarer'">Wayfarer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
  </th:block>

  <nav class="site-nav" th:fragment="nav">
    <div class="wrap">
      <a href="/" class="brand">Wayfarer<span class="mark">.</span></a>
      <div class="nav-links">
        <a href="/">Destinations</a>
        <a href="/about">About</a>
      </div>
    </div>
  </nav>

  <footer th:fragment="footer">
    <div class="wrap">
      <a href="/" class="brand">Wayfarer<span class="mark">.</span></a>
      <span class="fine-print">A field guide to Europe, built one city at a time.</span>
    </div>
  </footer>

</body>
</html>
